repos:
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: clang-format -i
        # 用 PyPI 的 clang-format 轮子（不是系统 /usr/bin/clang-format 14），
        # 版本固定为 22.1.0，与 VS Code clangd 22.1.0 内置的 clang-format 对齐，
        # 避免编辑器保存后的格式被钩子再改一遍；CI 与其他机器同样可复现。
        language: python
        additional_dependencies: ["clang-format==22.1.0"]
        files: ^(src/guga_perception/terrain_analysis|src/guga_controller/pb_omni_pid_pursuit_controller|src/guga_decision/simple_decision|src/guga_planner/jps_planner|src/guga_transform/nonrotating_vel_transform)/.*\.(c|cc|cpp|cxx|h|hh|hpp|hxx)$

      - id: test-terrain-analysis
        name: test terrain_analysis
        entry: scripts/pre-commit/run_terrain_analysis_tests.sh
        language: system
        pass_filenames: false
        files: ^(src/guga_perception/terrain_analysis/.*|scripts/pre-commit/run_terrain_analysis_tests\.sh|scripts/test/test_terrain_analysis_coverage\.sh)$

      - id: test-pid-controller
        name: test pid controller
        entry: scripts/pre-commit/run_pid_tests.sh
        language: system
        pass_filenames: false
        files: ^(src/guga_controller/pb_omni_pid_pursuit_controller/.*|scripts/pre-commit/run_pid_tests\.sh|scripts/test/test_pb_omni_pid_pursuit_controller\.sh)$

      - id: test-simple-decision
        name: test simple_decision
        entry: scripts/pre-commit/run_simple_decision_tests.sh
        language: system
        pass_filenames: false
        files: ^(src/guga_decision/simple_decision/.*|scripts/pre-commit/run_simple_decision_tests\.sh|scripts/test/test_simple_decision_coverage\.sh)$

      - id: test-jps-planner
        name: test jps_planner
        entry: scripts/pre-commit/run_jps_tests.sh
        language: system
        pass_filenames: false
        files: ^(src/guga_planner/jps_planner/.*|scripts/pre-commit/run_jps_tests\.sh|scripts/test/test_jps.*\.sh)$

      - id: test-mppi-controller
        name: test nav2_mppi_controller
        entry: scripts/pre-commit/run_mppi_tests.sh
        language: system
        pass_filenames: false
        files: ^(src/guga_controller/nav2_mppi_controller/.*|scripts/pre-commit/run_mppi_tests\.sh)$

      - id: test-nonrotating-vel-transform
        name: test nonrotating_vel_transform
        entry: scripts/pre-commit/run_nonrotating_tests.sh
        language: system
        pass_filenames: false
        files: ^(src/guga_transform/nonrotating_vel_transform/.*|scripts/pre-commit/run_nonrotating_tests\.sh)$
