name: Fresh Install CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/fresh-install.yml"
      - "scripts/ci/install_deps_humble.sh"
      - "scripts/ci/env_humble.sh"
      - "scripts/ci/generate_acados_mpc.sh"
      - "src/guga_controller/mpc_controller/test/py_sim/**"
      - "src/**/package.xml"
      - "src/**/CMakeLists.txt"
      - "README.md"

jobs:
  fresh-install:
    name: Verify clean ROS 2 Humble install
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base
    timeout-minutes: 90

    env:
      ROS_DISTRO: humble
      ACADOS_SOURCE_DIR: ${{ github.workspace }}/.deps/acados
      SMALL_GICP_SOURCE_DIR: ${{ github.workspace }}/.deps/small_gicp
      SMALL_GICP_INSTALL_PREFIX: /usr/local
      INSTALL_ACADOS_PYTHON: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trust checkout directory
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies from a clean workspace
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/install_deps_humble.sh

      - name: Verify dependency installation is repeatable
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/install_deps_humble.sh

      - name: Generate acados MPC solver
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/generate_acados_mpc.sh

      - name: Build workspace
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source scripts/ci/env_humble.sh
          set -u
          rosdep check --from-paths src --ignore-src --rosdistro humble
          package_args=()
          if [ "${HIK_MVS_AVAILABLE:-0}" != "1" ]; then
            # Public runners cannot download the closed-source MVS SDK.
            package_args+=(--packages-skip hik_driver)
          fi
          colcon build --symlink-install \
            "${package_args[@]}" \
            --cmake-args \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Verify installed tools and runtime imports
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          set -u
          python3 -c "import acados_template, xmacro"
          python3 -c 'import pathlib, os, acados_template; assert pathlib.Path(acados_template.__file__).resolve().is_relative_to(pathlib.Path(os.environ["ACADOS_SOURCE_DIR"]).resolve())'
          test -f "${ACADOS_SOURCE_DIR}/lib/libacados.so"
          test -x "${ACADOS_SOURCE_DIR}/bin/t_renderer"
          test -d "${SMALL_GICP_INSTALL_PREFIX}/include/small_gicp"
          test -f "${SMALL_GICP_INSTALL_PREFIX}/lib/libsmall_gicp.so"
          test -f "${SMALL_GICP_INSTALL_PREFIX}/lib/cmake/small_gicp/small_gicp-config.cmake"
          ros2 pkg prefix guga_ui_pangolin
          ros2 pkg prefix serial_driver
          if [ "${HIK_MVS_AVAILABLE:-0}" = "1" ]; then
            ros2 pkg prefix hik_driver
          fi
          ros2 launch pb2025_robot_description robot_description_launch.py --show-args >/dev/null

      - name: Run workspace tests
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          set -u
          package_args=()
          if [ "${HIK_MVS_AVAILABLE:-0}" != "1" ]; then
            package_args+=(--packages-skip hik_driver)
          fi
          colcon test \
            "${package_args[@]}" \
            --event-handlers console_direct+
          colcon test-result --all --verbose
