dynamic_obstacle_node:
  ros__parameters:

    # Gazebo world 名称
    world_name: "default"

    # 障碍物模型名称
    obstacle_name: "dynamic_obstacle"

    # SDF 模型文件
    model_file: "obstacle.sdf"

    # 初始位置
    start_x: -2.0
    start_y: 0.0
    start_z: 1.0

    # 运动范围
    min_x: -2.0
    max_x: 2.0

    # 障碍物运动速度 m/s
    speed: 0.5

    # 控制频率 Hz
    update_rate: 10.0

    # 是否启动时自动 spawn
    auto_spawn: true
