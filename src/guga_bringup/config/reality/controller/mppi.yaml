controller_server:
  ros__parameters:
    use_sim_time: False

    # controller_server 的节点级配置（plugin 列表、检查器、容差）。
    # 原先只写在单文件 nav2_params.yaml 里，而该文件自 670049b 起不再被加载，
    # 这些设置一直没有生效；此处按 pid profile 的取值补齐。
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    goal_checker_plugins: ["general_goal_checker"]
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.5
    failure_tolerance: 0.3
    odom_topic: odometry
    # 三个速度阈值（min_x/min_y/min_theta_velocity_threshold）在此故意不写：
    # MPPI 用 Omni 运动模型，y 方向存在小幅横向速度，Nav2 默认的
    # 0.0001/0.0001/0.0001 即是当前生效值（已确认 controller_server.cpp 的声明默认值）。
    # 已删除的单文件 nav2_params.yaml 里写过 0.001/0.5/0.001，但该文件自 670049b
    # 起不再被加载，这组取值从未生效；其中 min_y=0.5 会把 0.5 m/s 以下的横向速度
    # 当作零，与 Omni 控制相冲突，故不沿用。

    # 与仿真 profile 对齐：由 60.0 改为 30.0，model_dt 随之改为 1/30。
    controller_frequency: 30.0

    FollowPath:
      plugin: "guga_source_mppi_controller::MPPIController"
      # 以下采样与速度参数与仿真 profile（config/simulation/controller/mppi.yaml）保持一致。
      time_steps: 48
      # model_dt 必须与控制周期 1/controller_frequency 对齐（检查容差 1e-6）：
      #   - period < model_dt → 仅告警，控制序列移位关闭
      #   - |period - model_dt| < 1e-6 → 正常，控制序列移位开启（推荐）
      #   - period > model_dt → configure 抛异常，controller_server 起不来
      # YAML 不支持计算式；1/30 ≈ 0.033333333333，写 0.033333333（误差 <1e-6 即可）。
      # 若改 controller_frequency，model_dt 需同步改为 1/频率。
      model_dt: 0.03333333333
      batch_size: 1400
      # 耗时归因：true 时每 2 s 打印一行单周期拆解（prepare/optimize/平滑）以及每个
      # critic 的耗时（critic_manager.cpp / optimizer.cpp）。定位"算不过来"时打开
      debug_timing: false
      vx_std: 0.3
      vy_std: 0.3
      wz_std: 0.01
      vx_max: 3.0
      vx_min: -3.0
      # 加速度约束：本仓库 fork 的 MPPI 已移植上游 nav2 的这套（PR #4352 + #5266 + #6072）。
      # **减速侧必须与执行端一致**：ax_min/ay_min = -4.5 = velocity_smoother.max_decel。
      # 这是"滞后"与"过冲"这对症状的平衡点，别再只动一边：
      #   - 减速侧设成 0（不限制）：模型允许瞬间刹停，执行端只有 4.5 m/s² → 预测乐观、
      #     欠刹车 → **过冲**。0 只是"该方向不限制"（minAccelDelta 返回 -inf），不是
      #     "不允许变化"；它能把下面那条 odom 滞后 bug 掩盖掉，但不是正确配置
      #   - 减速侧设成 -3.0（比执行端 -4.5 更紧）：命令只能以 3 m/s² 下降，比执行端
      #     的 4.5 慢 → 刹车偏慢、整机"非常大的滞后"（停不住/过冲）
      #   - 设成 -4.5（= 执行端）：命令斜率与执行一致，既不乐观也不过保守
      # 命令侧的加速度钳制**以上一周期下发的指令为起点**（不是 state_.speed）：
      # odom 与点云同频（实车约 50 Hz、仿真约 10 Hz），相对 30 Hz 控制周期仍有
      # 半拍到数拍的延迟，prepare() 的滞后补偿会把 state_.speed 夹在陈旧实测值
      # 附近；若命令也从它起夹，减速命令会被钉在旧速度上，
      # |ax_min| 越小越明显——这正是"ax_min 不设 0 就过冲"的根因。现在 state_.speed
      # 只作预测初值，命令链独立按 ax 变化，odom 再慢也不会把刹车命令抬回去。
      # 想更快刹车：把 velocity_smoother.max_decel 与这里的 ax_min/ay_min **一起**放到
      # 台架实测值（如 -8），只改一边必然又回到"要么过冲、要么变慢"。
      # 若 -4.5 下仍过冲，残差来自执行/反馈滞后（串口滑动均值窗口、odom 延迟），
      # 按收益顺序调：serial filter_window_size 10→3、用 `ros2 topic delay /odometry`
      # 量反馈滞后（smoothing_frequency 已与控制器对齐到 30 Hz）。
      #   - 约束作用在预测轨迹的状态速度上、采样控制量保持原始；命令序列本身按
      #     上一周期指令逐步钳制。第 0 步用真实控制周期、之后用 model_dt
      #   - 加速侧必须**不宽于**下游 max_accel（4.5）：2.0 < 4.5 ✓（偏保守，只影响起步）
      #   - 逐轴独立；az 保持 0，因为 z 通道是底盘自旋（由 nonrotating_vel_transform
      #     叠加 cmd_spin），与整车轨迹无关
      #   - 单位：ax/ay = m/s²，az = rad/s²；ay 受麦克纳姆轮横向摩擦限制
      ax_max: 2.0
      ax_min: -4.5
      ay_max: 3.0
      ay_min: -4.5
      az_max: 0.0
      vy_max: 3.0
      vy_min: -4.0 # wz_max 保持 0，不照搬仿真的 3.0：实车的 yaw 由小陀螺与决策控制，MPPI 不输出转向速度。
      wz_max: 1.0

      iteration_count: 2
      temperature: 0.2
      gamma: 0.012
      motion_model: "Omni"
      visualize: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      Omni:
        plugin: "mppi::OmniMotionModel"
      critics:
        [
          "ConstraintCritic",
          "CostCritic",
          "GoalCritic",
          "GoalAngleCritic",
          "TwirlingCritic",
          "PathAlignCritic",
          "PathFollowCritic",
          "PreferForwardCritic",
          "PathAngleCritic",
        ]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      # 到点摆正车头：离目标 threshold_to_consider 以内时，按"轨迹末端朝向 vs 路径末端朝向"
      # 计代价。无小陀螺后车头只能靠控制器转，这个权重太小就摆不正（3.0 → 5.0）。
      # symmetric_yaw_tolerance=true 时反向对齐也算过（车头/车尾不分），按需打开。
      GoalAngleCritic:
        enabled: False
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: False
        cost_power: 2
        cost_weight: 5.0
        threshold_to_consider: 0.5
      # 注意：本块未列入上面的 critics 列表，当前不参与计算；取值与仿真 profile 对齐。
      # 若要启用，需先把 inflation_radius / cost_scaling_factor 改成与 local costmap
      # 膨胀层完全一致（local 当前是 0.60 / 4.0，否则距离反算本身就是错的）。
      # consider_footprint 保持 false：它的 distanceToObstacle() 在 footprint 模式下
      # 从 253 反算出的距离恒为内切半径（Humble 已知缺陷，issue #4057），这里要的是
      # 中心点代价那套公式。costmap 改成 footprint 后启用它会多一条
      # "Inconsistent configuration in collision checking" 的 WARN，属预期，不抛异常。
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 2.0
        critical_weight: 25.0
        consider_footprint: false
        collision_cost: 10000.0
        collision_margin_distance: 0.15
        near_goal_distance: 0.5
        inflation_radius: 0.367 # (only in Humble)
        cost_scaling_factor: 10.0 # (only in Humble)
      CostCritic:
        enabled: true
        # 对齐仿真（已验证的那套）：cost_weight 4.0、consider_footprint false。
        # consider_footprint: false 的语义：inCollision() 把 253(INSCRIBED) 也判为碰撞
        # （cost_critic.cpp:187-211），即"车中心不得进入内切环"，与仿真行为一致
        # （仿真实测几乎不会卡在内切区域）。代价是若中心真的落在环内，所有候选轨迹
        # 判碰撞 → fallback 重试 → 超限抛异常停车；用 base.yaml 的 footprint_padding
        # 0.03 + 全局膨胀余量把这种情形挡住。
        # 之前用 true 的理由（只写 robot_radius 时 initialize() 会抛 PlannerException）
        # 已随 base.yaml 回到 robot_radius 形态消失：use_radius_==true 与
        # consider_footprint_==false 自洽，不会再有 "Inconsistent configuration" WARN。
        cost_power: 1
        cost_weight: 4.0
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 10
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 7.0
        offset_from_furthest: 6
        threshold_to_consider: 0.8
      PathAngleCritic:
        enabled: False
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      # VelocityDeadbandCritic:
      #   enabled: true
      #   cost_power: 1
      #   cost_weight: 35.0
      #   deadband_velocities: [0.05, 0.05, 0.05]
      # 抑制"不必要的转向"。注意本 fork 的实现是**对整条轨迹的 mean|wz| 无条件计代价**
      # （twirling_critic.cpp:40-41），不是只在原地打转时生效 —— 所以它本质是"少转"的旋钮：
      # 车头老被甩/来回摆时调大，转不动/摆不正时调小或关掉。
      # 参数名坑：本 fork 读的是 cost_power / cost_weight；yaml 里原来的
      # twirling_cost_power / twirling_cost_weight **不会被读取**（默认 10.0 生效过）。
      TwirlingCritic:
        enabled: False
        cost_power: 1
        cost_weight: 3.0
local_costmap:
  local_costmap:
    ros__parameters:
      # 与控制器 profile 无关的节点级参数（坐标系、尺寸、频率、robot_radius、
      # static_layer）统一放在 base.yaml；本文件只保留 profile 之间的差异。
      robot_base_frame: base_footprint_nonrotating
      obstacle_layer:
        plugin: "pb_nav2_costmap_2d::ObstacleLayerLocal"
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        observation_sources: terrain_map terrain_returns_current
        terrain_map:
          data_type: "PointCloud2"
          # '<robot_namespace>' keyword shall be replaced with 'namespace' where user defined.
          # It doesn't need to start with '/'
          topic: <robot_namespace>/terrain_map
          # sensor_frame 只决定射线清除的原点坐标系，不参与点云变换
          # （点云变换用的是消息自己的 frame_id，即 odom）。留空时原点会取成 odom 原点，
          # 机器人离开 odom 原点超过代价地图半宽后，标记与清除都会因原点越界被跳过。
          sensor_frame: front_mid360
          marking: true
          clearing: false # 清除改由当帧返回的雷达射线云 terrain_returns_current 承担
          obstacle_max_range: 5.0
          obstacle_min_range: 0.2
          raytrace_max_range: 5.5
          raytrace_min_range: 0.2
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
        terrain_returns_current:
          data_type: "PointCloud2"
          topic: <robot_namespace>/terrain_returns_current
          # 当帧返回的雷达射线云，含地面返回的雷达射线。清除射线只要求"该方向上有一次返回的雷达射线"，
          # 地面返回的雷达射线正是射线路径为空的证据，因此它不必是障碍点。
          sensor_frame: front_mid360
          marking: false
          clearing: true
          observation_persistence: 0.0 # 只留最新一帧：清除用的是当帧观测
          obstacle_min_range: 0.2
          obstacle_max_range: 5.0
          raytrace_min_range: 0.2
          raytrace_max_range: 5.5
          # 源级高度范围是 odom 绝对高度：留 0 会把地面返回的雷达射线（绝对 z 略低于 0）
          # 在 ObservationBuffer 里滤掉，清除就失去这些射线。
          min_obstacle_height: -3.0
          max_obstacle_height: 3.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 对齐仿真（8.0）：膨胀代价 252·exp(-scale·(d - inscribed))，scale 越大带外掉得越快，
        # 才有"离障碍远一点更便宜"的梯度。原先 4.0 时整圈 0.4~0.6 m 都还在 100~250，
        # 几乎是个平台 → 车贴着 253 边界走也不吃亏（实测确实会进内切带）。
        # 现在 inscribed = robot_radius 0.367 + footprint_padding 0.03 ≈ 0.397：
        #   d = 0.42 m 处 ≈ 252·exp(-8×0.023) ≈ 210
        #   d = 0.50 m 处 ≈ 252·exp(-8×0.103) ≈ 111
        #   d = 0.60 m 处 ≈ 252·exp(-8×0.203) ≈ 50
        # 0.397 以内是 253（INSCRIBED），而 CostCritic.consider_footprint: false 把它判为
        # 碰撞 → 车中心不得进入；再往外才是软代价梯度。调大本条不压缩可通行的窄道宽度，
        # 硬边界只由 robot_radius + padding 决定。
        cost_scaling_factor: 8.0
        inflation_radius: 0.50

global_costmap:
  global_costmap:
    ros__parameters:
      # 节点级参数在 base.yaml，见 local_costmap 前的说明
      robot_base_frame: base_footprint_nonrotating

      obstacle_layer:
        plugin: "pb_nav2_costmap_2d::ObstacleLayerLocal"
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        observation_sources: terrain_map terrain_returns_current
        terrain_map:
          data_type: "PointCloud2"
          # '<robot_namespace>' keyword shall be replaced with 'namespace' where user defined.
          # It doesn't need to start with '/'
          topic: <robot_namespace>/terrain_map
          # sensor_frame 只决定射线清除的原点坐标系，不参与点云变换
          # （点云变换用的是消息自己的 frame_id，即 odom）。留空时原点会取成 odom 原点，
          # 机器人离开 odom 原点超过代价地图半宽后，标记与清除都会因原点越界被跳过。
          sensor_frame: front_mid360
          marking: true
          clearing: true
          obstacle_max_range: 10.0
          obstacle_min_range: 0.2
          raytrace_max_range: 5.0 # 试验值：与平面网格每轴 ±5.1 m 相当；对角约 7.2 m 方向上的标记清不到，待实车对比
          raytrace_min_range: 0.2
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
        terrain_returns_current:
          data_type: "PointCloud2"
          topic: <robot_namespace>/terrain_returns_current
          # 当帧返回的雷达射线云（含地面返回的雷达射线），只做清除。terrain_map 里只有障碍点，某方位视野内
          # 没有障碍时该方位一个端点都没有，落在那条路径上的旧标记清不掉；返回的雷达射线给出的
          # 是"该方位路径为空"这一证据。与 local 那条链的配置保持一致。
          sensor_frame: front_mid360
          marking: false
          clearing: true
          observation_persistence: 0.0 # 只留最新一帧：清除用的是当帧观测
          obstacle_min_range: 0.2
          obstacle_max_range: 10.0
          raytrace_min_range: 0.2
          raytrace_max_range: 5.0 # 试验值：与平面网格每轴 ±5.1 m 相当；对角约 7.2 m 方向上的标记清不到，待实车对比
          # 源级高度范围是 odom 绝对高度：留 0 会把地面返回的雷达射线在 ObservationBuffer 里滤掉。
          min_obstacle_height: -3.0
          max_obstacle_height: 3.0
        # 定位修正会让 map→odom 突然变化，此前按旧变换写入本层的障碍标记全部落在错误位置，
        # 且在非滚动代价地图上不会被清除。这里监视该变换，跳变时清空本层累积的标记并按新变换重建。
        # 只写在全局代价地图：局部代价地图走 odom，其全局系与观察子系同系，插件会自动跳过。
        tf_jump_reset_enabled: true
        tf_jump_child_frame: odom
        tf_jump_translation_threshold: 0.05 # 平移跳变阈值（m）
        tf_jump_yaw_threshold: 0.05 # 偏航跳变阈值（rad）
        tf_jump_min_interval: 2.0 # 两次重置的最短间隔（s），防止定位持续小幅修正时反复清图
        tf_jump_full_window: true # 重置那一轮把更新窗口扩到整张图；不扩时主代价地图窗口外的旧标记不会被重置，会继续留在图上
        tf_jump_skip_marking_cycles: 1 # 跳变后丢弃的观测轮数（缓冲里的点云是按旧变换写入全局系的）

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 对齐仿真（10.0 / 0.55）。原为 0.366，小于内切半径（0.367 + padding 0.03 =
        # 0.397），nav2 会一直报 "inflation radius smaller than the computed inscribed
        # radius"，而且全局路径的安全距离等于局部内切半径 → 全局路径本身就贴着相切带走，
        # 局部 MPPI 只能跟着。0.55 > 0.397 之后膨胀带才有意义。
        # 注意别再往上提到 0.9：膨胀代价按面积走（∝r²），而 global costmap 的
        # inflation 跑在控制器同一个容器里，会抢 CPU。
        cost_scaling_factor: 10.0
        inflation_radius: 0.50

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.

smoother_server:
  ros__parameters:
    use_sim_time: False

    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: False

    local_costmap_topic: local_costmap/costmap_raw

    global_costmap_topic: global_costmap/costmap_raw

    local_footprint_topic: local_costmap/published_footprint

    global_footprint_topic: global_costmap/published_footprint

    cycle_frequency: 10.0

    behavior_plugins:
      ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]

    spin:
      plugin: "nav2_behaviors/Spin"

    backup:
      plugin: "pb_nav2_behaviors/BackUpFreeSpace"

    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"

    wait:
      plugin: "nav2_behaviors/Wait"

    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"

    local_frame: odom

    global_frame: map

    robot_base_frame: base_footprint_nonrotating

    transform_tolerance: 0.1

    simulate_ahead_time: 2.0

    max_rotational_vel: 1.0

    min_rotational_vel: 0.4

    rotational_acc_lim: 3.2
    # params for pb_nav2_behaviors/BackUpFreeSpace

    # 方向判定与位姿都取局部代价地图：它才是决定控制器能否接手的图，
    # 且与执行中的 footprint 碰撞检查同图（碰撞检查由 behavior_server 用 local_costmap 建立）。
    service_name: "local_costmap/get_costmap"
    costmap_frame: odom

    max_radius: 3.0

    visualize: false

velocity_smoother:
  ros__parameters:
    use_sim_time: False

    # 与 controller_server.controller_frequency（30 Hz）对齐：此参数同时是 smoother
    # 的发布频率，设成 20 会先把控制器的 30 Hz 抽成 20 Hz，再交给 nonrotating 补到
    # 60 Hz——补出来的大部分是重复值。保持 30，让每一条控制指令都进入下游。
    smoothing_frequency: 30.0

    scale_velocities: False

    feedback: "OPEN_LOOP"

    max_velocity: [2.5, 2.5, 3.0]

    min_velocity: [-2.5, -2.5, -3.0]

    max_accel: [4.5, 4.5, 5.0]

    max_decel: [-4.5, -4.5, -5.0]

    odom_topic: "odometry"

    odom_duration: 0.1

    deadband_velocity: [0.0, 0.0, 0.0]

    velocity_timeout: 1.0

# ── 启动即小陀螺（导航启动时的底盘模式与自旋速度）──
# mppi 的 costmap 走 base_footprint_nonrotating，可以自旋；pid 的 costmap 仍用
# 旋转的 base_footprint，不能自旋，见 controller/pid.yaml。
nonrotating_vel_transform:
  ros__parameters:
    initial_chassis_mode: 1 # 1 = littleTES，启动即自旋
    init_spin_speed: 1.0 # 未收到 cmd_spin 前的固定自旋角速度 (rad/s)
