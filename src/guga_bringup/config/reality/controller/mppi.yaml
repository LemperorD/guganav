controller_server:
  ros__parameters:
    use_sim_time: False

    # controller_server 的节点级配置（plugin 列表、检查器、容差）。
    # 原先只写在单文件 nav2_params.yaml 里，而该文件自 670049b 起不再被加载，
    # 这些设置一直没有生效；此处按 pid profile 的取值补齐。
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    goal_checker_plugins: ["general_goal_checker"]
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 6.28
    failure_tolerance: 0.3
    odom_topic: odometry
    # 三个速度阈值（min_x/min_y/min_theta_velocity_threshold）在此故意不写：
    # MPPI 用 Omni 运动模型，y 方向存在小幅横向速度，Nav2 默认的
    # 0.0001/0.0001/0.0001 即是当前生效值（已确认 controller_server.cpp 的声明默认值）。
    # 已删除的单文件 nav2_params.yaml 里写过 0.001/0.5/0.001，但该文件自 670049b
    # 起不再被加载，这组取值从未生效；其中 min_y=0.5 会把 0.5 m/s 以下的横向速度
    # 当作零，与 Omni 控制相冲突，故不沿用。

    # 与仿真 profile 对齐：由 60.0 改为 30.0，model_dt 随之改为 1/30。
    controller_frequency: 30.0

    FollowPath:
      plugin: "guga_source_mppi_controller::MPPIController"
      # 以下采样与速度参数与仿真 profile（config/simulation/controller/mppi.yaml）保持一致。
      time_steps: 56
      # model_dt 必须与控制周期 1/controller_frequency 对齐（检查容差 1e-6）：
      #   - period < model_dt → 仅告警，控制序列移位关闭
      #   - |period - model_dt| < 1e-6 → 正常，控制序列移位开启（推荐）
      #   - period > model_dt → configure 抛异常，controller_server 起不来
      # YAML 不支持计算式；1/30 ≈ 0.033333333333，写 0.033333333（误差 <1e-6 即可）。
      # 若改 controller_frequency，model_dt 需同步改为 1/频率。
      model_dt: 0.033333333
      batch_size: 1800
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.00001
      vx_max: 2.5
      vx_min: -2.5
      # 加速度约束：本仓库 fork 的 MPPI 已移植上游 nav2 的这套（PR #4352 + #5266 + #6072），
      # 全部默认 0 = 关闭。开启后约束作用在预测轨迹的**状态速度**上，采样控制量保持原始；
      # 第 0 步用真实控制周期、之后用 model_dt（见 optimizer.cpp 的
      # applyControlSequenceInterIterationConstraints / applyControlSequenceConstraints）。
      # 起始值建议先与 velocity_smoother 的 max_accel/max_decel 对齐（当前 4.5 / -4.5），
      # 台架实测后再收；ay 受麦克纳姆轮横向摩擦限制，通常比 ax 小。
      # 注意单位：ax/ay 是 m/s²，az 是 rad/s²（实车 wz_max=0，az 暂时用不到）。
      # 采样标准差建议同步按 a_max·model_dt 收缩（4.5 × 1/30 ≈ 0.15），
      # 否则 vx_std=0.2 会在采样物理不可达的状态，表现为抖动。
      ax_max: 3.0
      ax_min: -3.0
      ay_max: 3.0
      ay_min: -3.0
      az_max: 0.0
      vy_max: 2.5
      # wz_max 保持 0，不照搬仿真的 3.0：实车的 yaw 由小陀螺与决策控制，MPPI 不输出转向速度。
      wz_max: 0.0

      iteration_count: 1
      temperature: 0.3
      gamma: 0.012
      motion_model: "Omni"
      visualize: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      Omni:
        plugin: "mppi::OmniMotionModel"
      critics:
        [
          "ConstraintCritic",
          "CostCritic",
          "GoalCritic",
          "PathAlignCritic",
          "PathFollowCritic",
        ]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 2.0
      GoalAngleCritic:
        enabled: false
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: false
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      # 注意：本块未列入上面的 critics 列表，当前不参与计算；取值与仿真 profile 对齐。
      # 若要启用，需先把 inflation_radius / cost_scaling_factor 改成与 local costmap
      # 膨胀层完全一致（local 当前是 0.60 / 4.0，否则距离反算本身就是错的）。
      # consider_footprint 保持 false：它的 distanceToObstacle() 在 footprint 模式下
      # 从 253 反算出的距离恒为内切半径（Humble 已知缺陷，issue #4057），这里要的是
      # 中心点代价那套公式。costmap 改成 footprint 后启用它会多一条
      # "Inconsistent configuration in collision checking" 的 WARN，属预期，不抛异常。
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 2.0
        critical_weight: 25.0
        consider_footprint: false
        collision_cost: 10000.0
        collision_margin_distance: 0.15
        near_goal_distance: 0.5
        inflation_radius: 0.367 # (only in Humble)
        cost_scaling_factor: 10.0 # (only in Humble)
      CostCritic:
        enabled: true
        # 与仿真一致（原为 cost_power 10 / cost_weight 14）。照搬后实车避障的保守程度
        # 与仿真相同，而仿真这套参数的已知表现是偶发擦碰障碍，实车验证时重点看这一项。
        cost_power: 1
        cost_weight: 6.0
        critical_cost: 300.0
        # 依赖 local costmap 里显式写出的 16 边形 footprint（config/reality/base.yaml），
        # 那边 use_radius_ 才会是 false。只写 robot_radius 时这里开 true 会命中
        # cost_critic.cpp:56-66 的 "Considering footprint in collision checking but no
        # robot footprint provided in the costmap."：controller_server configure 失败 →
        # lifecycle_manager_navigation 中止 bringup → planner_server 不 configure，
        # global_costmap 没有发布者（表现为启动后没有代价地图）。
        # 语义变化：consider_footprint=true 时 inCollision() 对 253(INSCRIBED) 返回
        # false，只有压到 254(LETHAL) 才算碰撞（1e6），253 只累加 critical_cost
        # （cost_critic.cpp:187-211）。即"中心进内切环"从硬碰撞降为软惩罚，机器人
        # 可以用上膨胀带；代价是更贴障碍，要配合 inflation_radius/权重一起看。
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.2
        offset_from_furthest: 10
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: false
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      # VelocityDeadbandCritic:
      #   enabled: true
      #   cost_power: 1
      #   cost_weight: 35.0
      #   deadband_velocities: [0.05, 0.05, 0.05]
      TwirlingCritic:
        enabled: false
        twirling_cost_power: 1
        twirling_cost_weight: 10.0
local_costmap:
  local_costmap:
    ros__parameters:
      # 与控制器 profile 无关的节点级参数（坐标系、尺寸、频率、robot_radius、
      # static_layer）统一放在 base.yaml；本文件只保留 profile 之间的差异。
      robot_base_frame: base_footprint_nonrotating
      obstacle_layer:
        plugin: "pb_nav2_costmap_2d::ObstacleLayerLocal"
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        observation_sources: terrain_map terrain_returns_current
        terrain_map:
          data_type: "PointCloud2"
          # '<robot_namespace>' keyword shall be replaced with 'namespace' where user defined.
          # It doesn't need to start with '/'
          topic: <robot_namespace>/terrain_map
          # sensor_frame 只决定射线清除的原点坐标系，不参与点云变换
          # （点云变换用的是消息自己的 frame_id，即 odom）。留空时原点会取成 odom 原点，
          # 机器人离开 odom 原点超过代价地图半宽后，标记与清除都会因原点越界被跳过。
          sensor_frame: front_mid360
          marking: true
          clearing: false # 清除改由当帧返回的雷达射线云 terrain_returns_current 承担
          obstacle_max_range: 5.0
          obstacle_min_range: 0.2
          raytrace_max_range: 5.5
          raytrace_min_range: 0.2
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
        terrain_returns_current:
          data_type: "PointCloud2"
          topic: <robot_namespace>/terrain_returns_current
          # 当帧返回的雷达射线云，含地面返回的雷达射线。清除射线只要求"该方向上有一次返回的雷达射线"，
          # 地面返回的雷达射线正是射线路径为空的证据，因此它不必是障碍点。
          sensor_frame: front_mid360
          marking: false
          clearing: true
          observation_persistence: 0.0 # 只留最新一帧：清除用的是当帧观测
          obstacle_min_range: 0.2
          obstacle_max_range: 5.0
          raytrace_min_range: 0.2
          raytrace_max_range: 5.5
          # 源级高度范围是 odom 绝对高度：留 0 会把地面返回的雷达射线（绝对 z 略低于 0）
          # 在 ObservationBuffer 里滤掉，清除就失去这些射线。
          min_obstacle_height: -3.0
          max_obstacle_height: 3.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        # 原为 0.364，小于 robot_radius(0.367) 即 inscribed 半径：膨胀区里全部是 253
        # （INSCRIBED），而 CostCritic 与 ObstaclesCritic 都把 253 直接判为碰撞，于是
        # 机器人一进膨胀区，每条候选轨迹的首点就落在 253 上，全部轨迹作废、fail_flag
        # 置位，优化器 reset 一次后抛 "Optimizer fail to compute path"，控制器停住。
        # 取 0.60 之后，0.367～0.60 之间是有梯度的软代价区
        # （253 × exp(-4.0 × (d - 0.367))：0.45 m 处约 183，0.60 m 处约 100），
        # 机器人可以进入这一带而不再被判碰撞；253 区仍等于车体接触区。
        # 硬碰撞边界由 robot_radius 决定，调大本条不压缩可通行的窄道宽度。
        inflation_radius: 0.60

global_costmap:
  global_costmap:
    ros__parameters:
      # 节点级参数在 base.yaml，见 local_costmap 前的说明
      robot_base_frame: base_footprint_nonrotating

      obstacle_layer:
        plugin: "pb_nav2_costmap_2d::ObstacleLayerLocal"
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        observation_sources: terrain_map terrain_returns_current
        terrain_map:
          data_type: "PointCloud2"
          # '<robot_namespace>' keyword shall be replaced with 'namespace' where user defined.
          # It doesn't need to start with '/'
          topic: <robot_namespace>/terrain_map
          # sensor_frame 只决定射线清除的原点坐标系，不参与点云变换
          # （点云变换用的是消息自己的 frame_id，即 odom）。留空时原点会取成 odom 原点，
          # 机器人离开 odom 原点超过代价地图半宽后，标记与清除都会因原点越界被跳过。
          sensor_frame: front_mid360
          marking: true
          clearing: true
          obstacle_max_range: 10.0
          obstacle_min_range: 0.2
          raytrace_max_range: 5.0 # 试验值：与平面网格每轴 ±5.1 m 相当；对角约 7.2 m 方向上的标记清不到，待实车对比
          raytrace_min_range: 0.2
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
        terrain_returns_current:
          data_type: "PointCloud2"
          topic: <robot_namespace>/terrain_returns_current
          # 当帧返回的雷达射线云（含地面返回的雷达射线），只做清除。terrain_map 里只有障碍点，某方位视野内
          # 没有障碍时该方位一个端点都没有，落在那条路径上的旧标记清不掉；返回的雷达射线给出的
          # 是"该方位路径为空"这一证据。与 local 那条链的配置保持一致。
          sensor_frame: front_mid360
          marking: false
          clearing: true
          observation_persistence: 0.0 # 只留最新一帧：清除用的是当帧观测
          obstacle_min_range: 0.2
          obstacle_max_range: 10.0
          raytrace_min_range: 0.2
          raytrace_max_range: 5.0 # 试验值：与平面网格每轴 ±5.1 m 相当；对角约 7.2 m 方向上的标记清不到，待实车对比
          # 源级高度范围是 odom 绝对高度：留 0 会把地面返回的雷达射线在 ObservationBuffer 里滤掉。
          min_obstacle_height: -3.0
          max_obstacle_height: 3.0
        # 定位修正会让 map→odom 突然变化，此前按旧变换写入本层的障碍标记全部落在错误位置，
        # 且在非滚动代价地图上不会被清除。这里监视该变换，跳变时清空本层累积的标记并按新变换重建。
        # 只写在全局代价地图：局部代价地图走 odom，其全局系与观察子系同系，插件会自动跳过。
        tf_jump_reset_enabled: true
        tf_jump_child_frame: odom
        tf_jump_translation_threshold: 0.05 # 平移跳变阈值（m）
        tf_jump_yaw_threshold: 0.05 # 偏航跳变阈值（rad）
        tf_jump_min_interval: 2.0 # 两次重置的最短间隔（s），防止定位持续小幅修正时反复清图
        tf_jump_full_window: true # 重置那一轮把更新窗口扩到整张图；不扩时主代价地图窗口外的旧标记不会被重置，会继续留在图上
        tf_jump_skip_marking_cycles: 1 # 跳变后丢弃的观测轮数（缓冲里的点云是按旧变换写入全局系的）

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.366

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.

smoother_server:
  ros__parameters:
    use_sim_time: False

    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: False

    local_costmap_topic: local_costmap/costmap_raw

    global_costmap_topic: global_costmap/costmap_raw

    local_footprint_topic: local_costmap/published_footprint

    global_footprint_topic: global_costmap/published_footprint

    cycle_frequency: 10.0

    behavior_plugins:
      ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]

    spin:
      plugin: "nav2_behaviors/Spin"

    backup:
      plugin: "pb_nav2_behaviors/BackUpFreeSpace"

    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"

    wait:
      plugin: "nav2_behaviors/Wait"

    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"

    local_frame: odom

    global_frame: map

    robot_base_frame: base_footprint_nonrotating

    transform_tolerance: 0.1

    simulate_ahead_time: 2.0

    max_rotational_vel: 1.0

    min_rotational_vel: 0.4

    rotational_acc_lim: 3.2
    # params for pb_nav2_behaviors/BackUpFreeSpace

    # 方向判定与位姿都取局部代价地图：它才是决定控制器能否接手的图，
    # 且与执行中的 footprint 碰撞检查同图（碰撞检查由 behavior_server 用 local_costmap 建立）。
    service_name: "local_costmap/get_costmap"
    costmap_frame: odom

    max_radius: 3.0

    visualize: false

velocity_smoother:
  ros__parameters:
    use_sim_time: False

    smoothing_frequency: 20.0

    scale_velocities: False

    feedback: "OPEN_LOOP"

    max_velocity: [2.5, 2.5, 3.0]

    min_velocity: [-2.5, -2.5, -3.0]

    max_accel: [4.5, 4.5, 5.0]

    max_decel: [-4.5, -4.5, -5.0]

    odom_topic: "odometry"

    odom_duration: 0.1

    deadband_velocity: [0.0, 0.0, 0.0]

    velocity_timeout: 1.0

# 末端（串口驱动之前）的官方 velocity_smoother，仅在
# `use_driver_vel_smoother:=True` 时启动，用来替代串口里自研的滑动窗口均值：
#   nonrotating_vel_transform --cmd_vel_driver_raw--> 本节点 --cmd_vel--> serial_driver
# 官方节点是定时器驱动的速率限制器（每个 tick 允许 max_accel/smoothing_frequency
# 的变化量），所以它把上游 ~10 Hz 的阶梯指令插值成斜坡，而且没有滑动均值的群延迟
# （10 帧均值在 10 Hz 下 ≈450 ms；同样的 0.45 m/s 台阶用 4.5 m/s² 只需 100 ms）。
# 开启时把串口 filter_window_size 设成 1（关闭），否则两层滤波叠加。
# 注意：本节点在**底盘系**里限速（nonrotating 的变换之后），自旋很快时指令分量本身
# 就以 ω·|v| 变化（1.0 rad/s、2.5 m/s → 2.5 m/s²；6.28 rad/s → 15.7 m/s²），
# 上限卡太紧会把自旋补偿限坏——台架确认后再决定是否收严。
velocity_smoother_driver:
  ros__parameters:
    use_sim_time: False

    # 比控制器频率高一档：既降低每 tick 的步长（4.5/50 = 0.09 m/s），
    # 也让下发到 MCU 的更新率从 ~10 Hz 提到 50 Hz
    smoothing_frequency: 50.0

    scale_velocities: False

    feedback: "OPEN_LOOP"

    max_velocity: [2.5, 2.5, 3.0]

    min_velocity: [-2.5, -2.5, -3.0]

    max_accel: [4.5, 4.5, 5.0]

    max_decel: [-4.5, -4.5, -5.0]

    odom_topic: "odometry"

    odom_duration: 0.1

    deadband_velocity: [0.0, 0.0, 0.0]

    velocity_timeout: 1.0
