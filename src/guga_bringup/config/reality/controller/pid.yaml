# reality/controller/pid.yaml — 实车控制器差异参数（PID + costmap 差异 + 调参）。
controller_server:
  ros__parameters:
    use_sim_time: False

    odom_topic: odometry

    controller_frequency: 60.0

    min_x_velocity_threshold: 0.001

    # 与 simulation/controller/pid.yaml 的 0.001 不一致：实车 PID 先沿用现场验证过的
    # 取值，0.5 会把 0.5 m/s 以下的横向速度当作零，是否吞掉小幅横向微调待实车验证。
    min_y_velocity_threshold: 0.5

    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.3

    progress_checker_plugins: ["progress_checker"]

    goal_checker_plugins: ["general_goal_checker"]

    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 6.28

    FollowPath:
      plugin: "pb_omni_pid_pursuit_controller::OmniPidPursuitControllerNode"
      translation_kp: 3.0
      translation_ki: 0.1
      translation_kd: 0.3
      enable_rotation: true
      rotation_kp: 1.0
      rotation_ki: 0.01
      rotation_kd: 0.1
      transform_tolerance: 0.5
      min_max_sum_error: 1.0
      lookahead_dist: 2.0
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 1.0
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.0
      use_interpolation: false
      use_rotate_to_heading: false
      use_rotate_to_heading_treshold: 0.1
      min_approach_linear_velocity: 0.5
      approach_velocity_scaling_dist: 1.0
      v_linear_min: -2.5
      v_linear_max: 2.5
      v_angular_min: -3.0
      v_angular_max: 3.0
      spin_speed: 2.0 # LITTLE_TES 默认目标角速度 (rad/s)
      curvature_min: 0.4 # 低曲率阈值，低于此值不减速。
      curvature_max: 0.7 # 高曲率阈值，高于此值大幅减速。
      reduction_ratio_at_high_curvature: 0.5 # 高曲率时的速度降低比例。 0.5 (即减速 50%)
      curvature_forward_dist: 0.7 # 前向距离，用于曲率计算
      curvature_backward_dist: 0.3 # 后向距离，用于曲率计算
      max_velocity_scaling_factor_rate: 0.9 # 速度缩放因子的最大变化率

local_costmap:
  local_costmap:
    ros__parameters:
      # 与控制器 profile 无关的节点级参数（坐标系、尺寸、频率、robot_radius、
      # static_layer）统一放在 base.yaml；本文件只保留 profile 之间的差异。
      robot_base_frame: base_footprint

      obstacle_layer:
        plugin: "pb_nav2_costmap_2d::ObstacleLayerLocal"
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        observation_sources: terrain_map terrain_returns_current
        terrain_map:
          data_type: "PointCloud2"
          # '<robot_namespace>' keyword shall be replaced with 'namespace' where user defined.
          # It doesn't need to start with '/'
          topic: <robot_namespace>/terrain_map
          # sensor_frame 只决定射线清除的原点坐标系，不参与点云变换
          # （点云变换用的是消息自己的 frame_id，即 odom）。留空时原点会取成 odom 原点，
          # 机器人离开 odom 原点超过代价地图半宽后，标记与清除都会因原点越界被跳过。
          sensor_frame: front_mid360
          marking: true
          clearing: false # 清除改由当帧返回的雷达射线云 terrain_returns_current 承担
          obstacle_max_range: 5.0
          obstacle_min_range: 0.2
          raytrace_max_range: 5.5
          raytrace_min_range: 0.2
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
        terrain_returns_current:
          data_type: "PointCloud2"
          topic: <robot_namespace>/terrain_returns_current
          # 当帧返回的雷达射线云，含地面返回的雷达射线。清除射线只要求"该方向上有一次返回的雷达射线"，
          # 地面返回的雷达射线正是射线路径为空的证据，因此它不必是障碍点。
          sensor_frame: front_mid360
          marking: false
          clearing: true
          observation_persistence: 0.0 # 只留最新一帧：清除用的是当帧观测
          obstacle_min_range: 0.2
          obstacle_max_range: 5.0
          raytrace_min_range: 0.2
          raytrace_max_range: 5.5
          # 源级高度范围是 odom 绝对高度：留 0 会把地面返回的雷达射线（绝对 z 略低于 0）
          # 在 ObservationBuffer 里滤掉，清除就失去这些射线。
          min_obstacle_height: -3.0
          max_obstacle_height: 3.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.7

global_costmap:
  global_costmap:
    ros__parameters:
      # 节点级参数在 base.yaml，见 local_costmap 前的说明
      robot_base_frame: base_footprint

      obstacle_layer:
        plugin: "pb_nav2_costmap_2d::ObstacleLayerLocal"
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        observation_sources: terrain_map terrain_returns_current
        terrain_map:
          data_type: "PointCloud2"
          # '<robot_namespace>' keyword shall be replaced with 'namespace' where user defined.
          # It doesn't need to start with '/'
          topic: <robot_namespace>/terrain_map
          # sensor_frame 只决定射线清除的原点坐标系，不参与点云变换
          # （点云变换用的是消息自己的 frame_id，即 odom）。留空时原点会取成 odom 原点，
          # 机器人离开 odom 原点超过代价地图半宽后，标记与清除都会因原点越界被跳过。
          sensor_frame: front_mid360
          marking: true
          clearing: true
          obstacle_max_range: 10.0
          obstacle_min_range: 0.2
          raytrace_max_range: 5.0 # 试验值：与平面网格每轴 ±5.1 m 相当；对角约 7.2 m 方向上的标记清不到，待实车对比
          raytrace_min_range: 0.2
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
        terrain_returns_current:
          data_type: "PointCloud2"
          topic: <robot_namespace>/terrain_returns_current
          # 当帧返回的雷达射线云（含地面返回的雷达射线），只做清除。terrain_map 里只有障碍点，某方位视野内
          # 没有障碍时该方位一个端点都没有，落在那条路径上的旧标记清不掉；返回的雷达射线给出的
          # 是"该方位路径为空"这一证据。与 local 那条链的配置保持一致。
          sensor_frame: front_mid360
          marking: false
          clearing: true
          observation_persistence: 0.0 # 只留最新一帧：清除用的是当帧观测
          obstacle_min_range: 0.2
          obstacle_max_range: 10.0
          raytrace_min_range: 0.2
          raytrace_max_range: 5.0 # 试验值：与平面网格每轴 ±5.1 m 相当；对角约 7.2 m 方向上的标记清不到，待实车对比
          # 源级高度范围是 odom 绝对高度：留 0 会把地面返回的雷达射线在 ObservationBuffer 里滤掉。
          min_obstacle_height: -3.0
          max_obstacle_height: 3.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.55

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.

smoother_server:
  ros__parameters:
    use_sim_time: False

    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: False

    local_costmap_topic: local_costmap/costmap_raw

    global_costmap_topic: global_costmap/costmap_raw

    local_footprint_topic: local_costmap/published_footprint

    global_footprint_topic: global_costmap/published_footprint

    cycle_frequency: 10.0

    behavior_plugins:
      ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait", "escape_obstacle_layer"]

    spin:
      plugin: "nav2_behaviors/Spin"

    # 标准 BackUp 保持 nav2 语义：固定距离，起点已在障碍里时会在第一步判碰撞失败。
    # "从膨胀层里出来"由下面的 escape_obstacle_layer 负责，两者不要混用。
    backup:
      plugin: "nav2_behaviors/BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"

    wait:
      plugin: "nav2_behaviors/Wait"

    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"

    escape_obstacle_layer:
      plugin: "pb_nav2_behaviors/EscapeObstacleLayer"

    local_frame: odom

    global_frame: map

    robot_base_frame: base_footprint

    transform_tolerance: 0.1

    simulate_ahead_time: 2.0

    max_rotational_vel: 1.0

    min_rotational_vel: 0.4

    rotational_acc_lim: 3.2
    # ── pb_nav2_behaviors/EscapeObstacleLayer ──
    # 和 mppi profile 一样取局部代价地图（odom 系）：pid 的控制器同样只看局部图。
    service_name: "local_costmap/get_costmap"
    costmap_frame: odom

    # 行走/搜索上限。正常情况下出口在 0.1~0.5 m，这条只是安全阀，不要当后退距离用。
    default_max_distance: 1.2
    default_speed: 0.25
    default_time_allowance: 8.0
    # 脱离 253 后再多走一点，避免停在代价 240+ 的边界上又被判失败
    exit_clearance: 0.1
    # 起点本身就压在 254 里时，允许穿过这么厚的真障碍把车拉出来
    lethal_traverse_distance: 0.5
    footprint_radius: 0.4
    # 执行中重选方向的周期，以及"新方向与当前方向夹角小于该值就不换"的迟滞（20°）
    rescan_period: 0.2
    angle_hysteresis: 0.3490658503988659

velocity_smoother:
  ros__parameters:
    use_sim_time: False

    smoothing_frequency: 20.0

    scale_velocities: False

    feedback: "OPEN_LOOP"

    max_velocity: [2.5, 2.5, 3.0]

    min_velocity: [-2.5, -2.5, -3.0]

    max_accel: [4.5, 4.5, 5.0]

    max_decel: [-4.5, -4.5, -5.0]

    odom_topic: "odometry"

    odom_duration: 0.1

    deadband_velocity: [0.0, 0.0, 0.0]

    velocity_timeout: 1.0

# ── 底盘模式：pid 的 costmap 仍用旋转的 base_footprint，不能自旋 ──
# 跟随模式下本节点不叠加自旋（enable_spin 开关在 base.yaml 里，另行控制）。
nonrotating_vel_transform:
  ros__parameters:
    initial_chassis_mode: 0 # 0 = chassisFollowed
    init_spin_speed: 0.0
