# reality/planner/jps.yaml — 实车规划器参数（planner_server + costmap plugins/esdf）。
planner_server:
  ros__parameters:
    use_sim_time: False
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "jps_planner/JPSPlanner"
      w_euc_cost: 1.0
      w_traversal_cost: 10.0
      w_heuristic_cost: 1.0
      allow_unknown: false
      enable_bspline: true

local_costmap:
  local_costmap:
    ros__parameters:

      plugins: ["static_layer", "intensity_voxel_layer", "esdf_layer", "inflation_layer"]

      esdf_layer:
        plugin: rog_map_layer::EsdfLayer
        enabled: true
        max_distance: 2.0
        publish_esdf_grid: false
        write_to_master: true
        incremental_update: true
        full_update_ratio: 0.3
        obstacle_threshold: 254
        enable_parallel: true
        num_threads: 3
        tile_size: 32
        seam_iterations: 2

global_costmap:
  global_costmap:
    ros__parameters:

      plugins: ["static_layer", "intensity_voxel_layer", "esdf_layer", "inflation_layer"]

      esdf_layer:
        plugin: rog_map_layer::EsdfLayer
        enabled: true
        max_distance: 3.0
        publish_esdf_grid: false
        write_to_master: true
        incremental_update: true
        full_update_ratio: 0.3
        obstacle_threshold: 254
        enable_parallel: true
        num_threads: 3
        tile_size: 32
        seam_iterations: 2

