# planner/jps_slam.yaml — 建图（slam）专用 JPS 参数
# 与 jps.yaml 的唯一差异：allow_unknown=true（未探索区域 unknown=255 视为可通行），
# 建图/探索时敢走未解锁地点。由 simulation_launch.py 在 slam:=True 且 planner:=jps 时选用。
planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "jps_planner/JPSPlanner"
      w_euc_cost: 1.0
      w_traversal_cost: 10.0
      w_heuristic_cost: 1.0
      allow_unknown: true
      enable_bspline: true
      enable_esdf: true
      esdf_weight: 200.0
      esdf_safe_distance: 1.5
      corridor_halfwidth: 15.0
      smoothness_weight: 20.0
      distance_weight: 0.3
      max_control_points: 24
      max_iterations: 300

local_costmap:
  local_costmap:
    ros__parameters:
      # 建图自举：首帧雷达地图形成前把未知空间视为自由空间，
      # 否则控制器会因周围全是 NO_INFORMATION 而拒绝起步。
      track_unknown_space: false

      # 局部滚动图不依赖尚不存在的全局静态图，只负责机器人周围即时避障。
      plugins: ["obstacle_layer", "esdf_layer", "inflation_layer"]

      esdf_layer:
        plugin: rog_map_layer::EsdfLayer
        enabled: true
        max_distance: 2.0
        publish_esdf_grid: true
        write_to_master: true
        incremental_update: true
        full_update_ratio: 0.3
        obstacle_threshold: 254
        enable_parallel: true
        num_threads: 3
        tile_size: 32
        seam_iterations: 2

global_costmap:
  global_costmap:
    ros__parameters:
      track_unknown_space: false

      # 建图模式没有预先存在的静态图；直接使用实时地形障碍。
      # 否则 static_layer 会等待 slam_toolbox 的首张 /map，形成
      # “不走就没有地图、没有地图就不能走”的启动死锁。
      plugins: ["obstacle_layer", "esdf_layer", "inflation_layer"]

      esdf_layer:
        plugin: rog_map_layer::EsdfLayer
        enabled: true
        max_distance: 3.0
        publish_esdf_grid: true
        write_to_master: true
        incremental_update: true
        full_update_ratio: 0.3
        obstacle_threshold: 254
        enable_parallel: true
        num_threads: 3
        tile_size: 32
        seam_iterations: 2
