# planner/jps.yaml — jps 规划器参数（planner_server + costmap plugins/esdf），覆盖前两层。
planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "jps_planner/JPSPlanner"
      w_euc_cost: 1.0
      w_traversal_cost: 10.0
      w_heuristic_cost: 1.0
      allow_unknown: false
      enable_bspline: true
      enable_esdf: true
      esdf_weight: 200.0
      esdf_safe_distance: 1.5
      corridor_halfwidth: 15.0
      smoothness_weight: 20.0
      distance_weight: 0.3
      max_control_points: 24
      max_iterations: 300

local_costmap:
  local_costmap:
    ros__parameters:

      plugins: ["static_layer", "intensity_voxel_layer", "esdf_layer", "inflation_layer"]

      esdf_layer:
        plugin: rog_map_layer::EsdfLayer
        enabled: true
        max_distance: 2.0
        publish_esdf_grid: true
        write_to_master: true
        incremental_update: true
        full_update_ratio: 0.3
        obstacle_threshold: 254
        enable_parallel: true
        num_threads: 3
        tile_size: 32
        seam_iterations: 2

global_costmap:
  global_costmap:
    ros__parameters:

      plugins: ["static_layer", "intensity_voxel_layer", "esdf_layer", "inflation_layer"]

      esdf_layer:
        plugin: rog_map_layer::EsdfLayer
        enabled: true
        max_distance: 3.0
        publish_esdf_grid: true
        write_to_master: true
        incremental_update: true
        full_update_ratio: 0.3
        obstacle_threshold: 254
        enable_parallel: true
        num_threads: 3
        tile_size: 32
        seam_iterations: 2
