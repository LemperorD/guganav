# controller/mppi.yaml — mppi 控制器差异参数，覆盖 base.yaml 的同名键。
local_costmap:
  local_costmap:
    ros__parameters:

      robot_base_frame: base_footprint_nonrotating

      width: 10

      height: 10

      robot_radius: 0.35

      obstacle_layer:
        plugin: "pb_nav2_costmap_2d::ObstacleLayerLocal"
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        observation_sources: terrain_map terrain_returns_current
        terrain_map:
          data_type: "PointCloud2"
          # '<robot_namespace>' keyword shall be replaced with 'namespace' where user defined.
          # It doesn't need to start with '/'
          topic: <robot_namespace>/terrain_map
          # sensor_frame 只决定射线清除的原点坐标系，不参与点云变换
          # （点云变换用的是消息自己的 frame_id，即 odom）。留空时原点会取成 odom 原点，
          # 机器人离开 odom 原点超过代价地图半宽后，标记与清除都会因原点越界被跳过。
          sensor_frame: front_mid360
          marking: true
          clearing: false  # 清除改由当帧回波云 terrain_returns_current 承担
          obstacle_max_range: 5.0
          obstacle_min_range: 0.2
          raytrace_max_range: 5.5
          raytrace_min_range: 0.2
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
        terrain_returns_current:
          data_type: "PointCloud2"
          topic: <robot_namespace>/terrain_returns_current
          # 当帧回波云，含地面回波。清除射线只要求"该方向上有一次回波"，
          # 地面回波正是射线路径为空的证据，因此它不必是障碍点。
          sensor_frame: front_mid360
          marking: false
          clearing: true
          observation_persistence: 0.0   # 只留最新一帧：清除用的是当帧观测
          obstacle_min_range: 0.2
          obstacle_max_range: 5.0
          raytrace_min_range: 0.2
          raytrace_max_range: 5.5
          # 源级高度范围是 odom 绝对高度：留 0 会把地面回波（绝对 z 略低于 0）
          # 在 ObservationBuffer 里滤掉，清除就失去这些射线。
          min_obstacle_height: -3.0
          max_obstacle_height: 3.0
        # 原第三方层 pb_nav2_costmap_2d::IntensityVoxelLayer 的参数（若要切回，本块换成这些）：
        #   track_unknown_space: true, publish_voxel_map: false, combination_method: 1,
        #   mark_threshold: 0, origin_z: 0.0, unknown_threshold: 5,
        #   z_resolution: 0.05, z_voxels: 16, min_obstacle_intensity: 0.1,
        #   max_obstacle_intensity: 2.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 8.0
        inflation_radius: 0.55
        num_threads: 4

behavior_server:
  ros__parameters:

    max_escape_distance: 0.5

    escape_clearance: 0.1

smoother_server:
  ros__parameters:

    SmoothPath:
      plugin: "nav2_constrained_smoother/ConstrainedSmoother"
      reversing_enabled: true       # whether to detect forward/reverse direction and cusps. Should be set to false for paths without orientations assigned
      path_downsampling_factor: 2   # every n-th node of the path is taken. Useful for speed-up
      path_upsampling_factor: 1     # 0 - path remains downsampled, 1 - path is upsampled back to original granularity using cubic bezier, 2... - more upsampling
      keep_start_orientation: true  # whether to prevent the start orientation from being smoothed
      keep_goal_orientation: true   # whether to prevent the gpal orientation from being smoothed
      minimum_turning_radius: 0.40  # minimum turning radius the robot can perform. Can be set to 0.0 (or w_curve can be set to 0.0 with the same effect) for diff-drive/holonomic robots
      w_curve: 30.0                 # weight to enforce minimum_turning_radius
      w_dist: 0.0                   # weight to bind path to original as optional replacement for cost weight
      w_smooth: 2000000.0           # weight to maximize smoothness of path
      w_cost: 0.015                 # weight to steer robot away from collision and cost

      # Parameters used to improve obstacle avoidance near cusps (forward/reverse movement changes)
      # See the [docs page](https://docs.nav2.org/configuration/packages/configuring-constrained-smoother) for further clarification
      w_cost_cusp_multiplier: 3.0   # option to have higher weight during forward/reverse direction change which is often accompanied with dangerous rotations
      cusp_zone_length: 2.5         # length of the section around cusp in which nodes use w_cost_cusp_multiplier (w_cost rises gradually inside the zone towards the cusp point, whose costmap weight equals w_cost*w_cost_cusp_multiplier)

      # Points in robot frame to grab costmap values from. Format: [x1, y1, weight1, x2, y2, weight2, ...]
      # IMPORTANT: Requires much higher number of iterations to actually improve the path. Uncomment only if you really need it (highly elongated/asymmetric robots)
      # See the [docs page](https://docs.nav2.org/configuration/packages/configuring-constrained-smoother) for further clarification
      # cost_check_points: [-0.185, 0.0, 1.0]

      optimizer:
        max_iterations: 100            # max iterations of smoother
        debug_optimizer: false        # print debug info
        gradient_tol: 5.0e+3
        fn_tol: 1.0e-15
        param_tol: 1.0e-20

controller_server:
  ros__parameters:

    # controller_server 的节点级配置（plugin 列表、检查器、容差）。
    # 原先只写在单文件 nav2_params.yaml 里，而该文件自 670049b 起不再被加载，
    # 这些设置一直没有生效；此处按 pid profile 的取值补齐（odom_topic 见 base.yaml）。
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    goal_checker_plugins: ["general_goal_checker"]
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 6.28
    failure_tolerance: 0.3
    # 三个速度阈值（min_x/min_y/min_theta_velocity_threshold）在此故意不写：
    # MPPI 用 Omni 运动模型，y 方向存在小幅横向速度，Nav2 默认的
    # 0.0001/0.0001/0.0001 即是当前生效值（已确认 controller_server.cpp 的声明默认值）。
    # 已删除的单文件 nav2_params.yaml 里写过 0.001/0.5/0.001，但该文件自 670049b
    # 起不再被加载，这组取值从未生效；其中 min_y=0.5 会把 0.5 m/s 以下的横向速度
    # 当作零，与 Omni 控制相冲突，故不沿用。

    controller_frequency: 30.0

    FollowPath:
      plugin: "guga_source_mppi_controller::MPPIController"
      time_steps: 56
      # model_dt 必须与控制周期 1/controller_frequency 对齐（检查容差 1e-6）：
      #   - period < model_dt → 仅告警，控制序列移位关闭
      #   - |period - model_dt| < 1e-6 → 正常，控制序列移位开启（推荐）
      #   - period > model_dt → configure 抛异常，controller_server 起不来
      # YAML 不支持计算式；1/30 ≈ 0.033333333333，写 0.033333333（误差 <1e-6 即可）。
      # 若改 controller_frequency，model_dt 需同步改为 1/频率。
      model_dt: 0.033333333
      batch_size: 2000
      vx_std: 0.5
      vy_std: 0.5
      wz_std: 1.0
      vx_max: 2.5
      vx_min: -2.5
      vy_max: 2.5
      wz_max: 3.0

      iteration_count: 1
      temperature: 0.3
      gamma: 0.015
      motion_model: "Omni"
      visualize: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      Omni:
        plugin: "mppi::OmniMotionModel"
      # To use Ackermann steering instead:
      # motion_model: "ackermann"
      # ackermann:
      #   plugin: "mppi::AckermannMotionModel"
      #   min_turning_r: 0.2
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "PathAlignCritic", "PathFollowCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 2.0
      GoalAngleCritic:
        enabled: false
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: false
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.0
        critical_weight: 25.0
        consider_footprint: false
        collision_cost: 10000.0
        collision_margin_distance: 0.15
        near_goal_distance: 0.5
        inflation_radius: 0.55 # (only in Humble)
        cost_scaling_factor: 10.0 # (only in Humble)
      CostCritic:
        enabled: true
        cost_power: 10
        cost_weight: 12.0
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.2
        offset_from_furthest: 10
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: false
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      # VelocityDeadbandCritic:
      #   enabled: true
      #   cost_power: 1
      #   cost_weight: 35.0
      #   deadband_velocities: [0.05, 0.05, 0.05]
      TwirlingCritic:
        enabled: false
        twirling_cost_power: 1
        twirling_cost_weight: 10.0

velocity_smoother:
  ros__parameters:

    smoothing_frequency: 20.0

    scale_velocities: True

    max_accel: [2.0, 2.0, 2.5]

    max_decel: [-3.0, -3.0, -4.0]

global_costmap:
  global_costmap:
    ros__parameters:

      robot_base_frame: base_footprint_nonrotating

      obstacle_layer:
        plugin: "pb_nav2_costmap_2d::ObstacleLayerLocal"
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        observation_sources: terrain_map terrain_returns_current
        terrain_map:
          data_type: "PointCloud2"
          # '<robot_namespace>' keyword shall be replaced with 'namespace' where user defined.
          # It doesn't need to start with '/'
          topic: <robot_namespace>/terrain_map
          # sensor_frame 只决定射线清除的原点坐标系，不参与点云变换
          # （点云变换用的是消息自己的 frame_id，即 odom）。留空时原点会取成 odom 原点，
          # 机器人离开 odom 原点超过代价地图半宽后，标记与清除都会因原点越界被跳过。
          sensor_frame: front_mid360
          marking: true
          clearing: true
          obstacle_max_range: 10.0
          obstacle_min_range: 0.2
          raytrace_max_range: 5.0    # 试验值：与平面网格每轴 ±5.1 m 相当；对角约 7.2 m 方向上的标记清不到，待实车对比
          raytrace_min_range: 0.2
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
        terrain_returns_current:
          data_type: "PointCloud2"
          topic: <robot_namespace>/terrain_returns_current
          # 当帧回波云（含地面回波），只做清除。terrain_map 里只有障碍点，某方位视野内
          # 没有障碍时该方位一个端点都没有，落在那条路径上的旧标记清不掉；回波给出的
          # 是"该方位路径为空"这一证据。与 local 那条链的配置保持一致。
          sensor_frame: front_mid360
          marking: false
          clearing: true
          observation_persistence: 0.0   # 只留最新一帧：清除用的是当帧观测
          obstacle_min_range: 0.2
          obstacle_max_range: 10.0
          raytrace_min_range: 0.2
          raytrace_max_range: 5.0    # 试验值：与平面网格每轴 ±5.1 m 相当；对角约 7.2 m 方向上的标记清不到，待实车对比
          # 源级高度范围是 odom 绝对高度：留 0 会把地面回波在 ObservationBuffer 里滤掉。
          min_obstacle_height: -3.0
          max_obstacle_height: 3.0
        # 原第三方层 pb_nav2_costmap_2d::IntensityVoxelLayer 的参数（若要切回，本块换成这些）：
        #   track_unknown_space: true, publish_voxel_map: false, combination_method: 1,
        #   mark_threshold: 0, origin_z: 0.0, unknown_threshold: 5,
        #   z_resolution: 0.05, z_voxels: 16, min_obstacle_intensity: 0.1,
        #   max_obstacle_intensity: 2.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 10.0
        inflation_radius: 0.55
        num_threads: 4

