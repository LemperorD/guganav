controller_server:
  ros__parameters:

    use_sim_time: True

    controller_frequency: 20.0

    min_x_velocity_threshold: 0.001

    min_y_velocity_threshold: 0.001

    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.3

    progress_checker_plugins: ["progress_checker"]

    goal_checker_plugins: ["general_goal_checker"]

    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 6.28

    FollowPath:
      plugin: "pb_omni_pid_pursuit_controller::OmniPidPursuitControllerNode"
      translation_kp: 1.5
      translation_ki: 0.0
      translation_kd: 0.3
      enable_rotation: true
      rotation_kp: 1.0
      rotation_ki: 0.0
      rotation_kd: 0.3
      transform_tolerance: 0.1
      min_max_sum_error: 1.0
      lookahead_dist: 2.0
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 1.0
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.2
      lateral_error_gain: 1.0
      max_lateral_velocity: 0.6
      lateral_error_deadband: 0.03
      use_interpolation: true
      use_rotate_to_heading: false
      use_rotate_to_heading_treshold: 0.0
      # use_rotate_to_heading: true
      # use_rotate_to_heading_treshold: 0.0
      min_approach_linear_velocity: 0.5
      approach_velocity_scaling_dist: 1.0
      v_linear_min: -2.5
      v_linear_max: 2.5
      v_angular_min: -3.0
      v_angular_max: 3.0
      spin_speed: 2.0                                  # LITTLE_TES 默认目标角速度 (rad/s)
      curvature_min: 0.4                                # 低曲率阈值，低于此值不减速。
      curvature_max: 0.7                                # 高曲率阈值，高于此值大幅减速。
      reduction_ratio_at_high_curvature: 0.5            # 高曲率时的速度降低比例。 0.5 (即减速 50%)
      curvature_forward_dist: 0.7                       # 前向距离，用于曲率计算
      curvature_backward_dist: 0.3                      # 后向距离，用于曲率计算
      max_velocity_scaling_factor_rate: 0.9             # 速度缩放因子的最大变化率


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
