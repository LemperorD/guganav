/**:
    ros__parameters:
        port_name : "/dev/ttyACM0"
        baud_rate : 115200 # options: 9600, 19200, 38400, 57600, 115200, 230400

        # 从pc到mcu的速度传输的倍数
        # pc端速度消息单位为m/s，mcu端则为mm/s
        vel_trans_scale : 200.0 # 理论值为1000，将其提取在yaml文件中调试

        # vx/vy 的滑动窗口均值帧数（wz 不滤波）。1 = 关闭滤波。
        # 窗口按帧数定义，等效滞后随 /cmd_vel 的发布频率变化：
        #   10 Hz 时 10 帧 ≈ 1 s 历史、群延迟 ≈ 450 ms（这是实车当前的设置）
        #   50 Hz 时同样的 10 帧只有 200 ms 历史、群延迟 ≈ 90 ms
        # 台架建议从 3 试起，确认不抖再往 1 收；配合上游官方 velocity_smoother
        # 做加速度整形时，本滤波可以设 1（关闭）。
        filter_window_size : 10
